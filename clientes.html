<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LiS Beauty | Clientes</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="sidebar-brand"><div class="brand-mark small">LiS</div><div><strong>LiS Beauty</strong><span>Admin</span></div></div><nav><a href="dashboard.html">Dashboard</a><a class="active" href="clientes.html">Clientes</a><a href="servicos.html">Serviços</a><a href="profissionais.html">Profissionais</a><a href="agenda.html">Agenda</a></nav><button id="logoutBtn" class="btn-secondary">Sair</button></aside>
<main class="content"><header class="topbar"><div><h1>Clientes</h1><p class="muted">Cadastro, edição e exclusão de clientes</p></div><button id="novoClienteBtn" class="btn-primary top-action">+ Novo cliente</button></header>
<section class="panel" id="clienteFormPanel"><div class="panel-header"><h2 id="clienteFormTitle">Novo cliente</h2></div><form id="clienteForm" class="form-grid"><input type="hidden" id="clienteId"><input id="clienteNome" placeholder="Nome completo" required><input id="clienteTelefone" placeholder="Telefone" required><input id="clienteEmail" type="email" placeholder="E-mail"><input id="clienteNascimento" type="date"><textarea id="clienteObservacoes" placeholder="Observações"></textarea><div class="form-actions"><button type="submit" class="btn-primary">Salvar cliente</button><button type="button" class="btn-secondary" id="cancelarClienteBtn">Cancelar</button></div></form><p id="clienteMessage" class="form-message"></p></section>
<section class="panel"><div class="panel-header"><h2>Clientes cadastrados</h2><input id="buscaCliente" class="search-input" placeholder="Buscar cliente..."></div><div id="clientesLista" class="table-wrap"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/clientes.js"></script></body></html>

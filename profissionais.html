<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LiS Beauty | Profissionais</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="sidebar-brand"><div class="brand-mark small">LiS</div><div><strong>LiS Beauty</strong><span>Admin</span></div></div><nav><a href="dashboard.html">Dashboard</a><a href="clientes.html">Clientes</a><a href="servicos.html">Serviços</a><a class="active" href="profissionais.html">Profissionais</a><a href="agenda.html">Agenda</a></nav><button id="logoutBtn" class="btn-secondary">Sair</button></aside>
<main class="content"><header class="topbar"><div><h1>Profissionais</h1><p class="muted">Cadastro, edição e exclusão da equipe</p></div><button id="novoProfissionalBtn" class="btn-primary top-action">+ Novo profissional</button></header>
<section class="panel" id="profissionalFormPanel"><div class="panel-header"><h2 id="profissionalFormTitle">Novo profissional</h2></div><form id="profissionalForm" class="form-grid"><input type="hidden" id="profissionalId"><input id="profissionalNome" placeholder="Nome completo" required><input id="profissionalTelefone" placeholder="Telefone"><input id="profissionalEspecialidade" placeholder="Especialidade"><input id="profissionalComissao" type="number" min="0" max="100" step="0.01" value="0" placeholder="Comissão %"><div class="form-actions"><button type="submit" class="btn-primary">Salvar profissional</button><button type="button" class="btn-secondary" id="cancelarProfissionalBtn">Cancelar</button></div></form><p id="profissionalMessage" class="form-message"></p></section>
<section class="panel"><div class="panel-header"><h2>Profissionais cadastrados</h2></div><div id="profissionaisLista" class="table-wrap"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/profissionais.js"></script></body></html>

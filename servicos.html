<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LiS Beauty | Serviços</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="sidebar-brand"><div class="brand-mark small">LiS</div><div><strong>LiS Beauty</strong><span>Admin</span></div></div><nav><a href="dashboard.html">Dashboard</a><a href="clientes.html">Clientes</a><a class="active" href="servicos.html">Serviços</a><a href="profissionais.html">Profissionais</a><a href="agenda.html">Agenda</a></nav><button id="logoutBtn" class="btn-secondary">Sair</button></aside>
<main class="content"><header class="topbar"><div><h1>Serviços</h1><p class="muted">Cadastro, edição e exclusão do catálogo</p></div><button id="novoServicoBtn" class="btn-primary top-action">+ Novo serviço</button></header>
<section class="panel" id="servicoFormPanel"><div class="panel-header"><h2 id="servicoFormTitle">Novo serviço</h2></div><form id="servicoForm" class="form-grid"><input type="hidden" id="servicoId"><input id="servicoNome" placeholder="Nome do serviço" required><input id="servicoCategoria" placeholder="Categoria"><input id="servicoDuracao" type="number" min="1" placeholder="Duração em minutos" required><input id="servicoValor" type="number" min="0" step="0.01" placeholder="Valor" required><select id="servicoTipoPreco"><option value="fixo">Preço fixo</option><option value="a_partir_de">A partir de</option></select><textarea id="servicoDescricao" placeholder="Descrição"></textarea><div class="form-actions"><button type="submit" class="btn-primary">Salvar serviço</button><button type="button" class="btn-secondary" id="cancelarServicoBtn">Cancelar</button></div></form><p id="servicoMessage" class="form-message"></p></section>
<section class="panel"><div class="panel-header"><h2>Serviços cadastrados</h2></div><div id="servicosLista" class="service-grid"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/servicos.js"></script></body></html>
